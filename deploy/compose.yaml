# «Орловский кинопоказ» (кино «Орёл») on TrueNAS: a stack of its own, with every
# module it needs. Nothing from the Lampa stack is shared or touched.
# Put this folder next to the other compose projects
# (e.g. /mnt/M2_Apps/arcane/projects/orel-kino), copy .env.example to .env,
# fill it in, then `docker compose up -d`.
#
# HTTPS comes from the Traefik that already runs on the server (network "proxy").

name: orel-kino

services:
  kino-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kino
      POSTGRES_DB: kino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino -d kino"]
      interval: 10s
      retries: 5
    mem_limit: 256m
    networks: [kino]

  kino-server:
    image: ghcr.io/geometrik32/kino:${KINO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kino:${POSTGRES_PASSWORD}@kino-db/kino
      IMAGE_CACHE_DIR: /var/cache/kino-img
      JACKETT_WAKE_URL: http://sablier:10000
      JACKETT_WAKE_GROUP: jackett
      JACKETT_WAKE_DURATION: 10m
      MAX_TRANSCODES: "${MAX_TRANSCODES:-4}"
    depends_on:
      kino-db:
        condition: service_healthy
    # Compact cache + up to 4 concurrent transcodes (3 active users + headroom) fit in 1280m.
    mem_limit: 1280m
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-107}"
    volumes:
      # Preloaded releases, the same folder qBittorrent downloads into.
      - ${DOWNLOADS_DIR:-/mnt/HDD_Data/orel-kino}:/downloads:ro
      # Disk cache for TMDB posters/backdrops (keeps image cache out of RAM).
      - ./data/image-cache:/var/cache/kino-img
    networks: [kino, proxy, vpn]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.orel-kino.rule: Host(`${KINO_HOST:?set KINO_HOST in .env}`)
      traefik.http.routers.orel-kino.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.orel-kino.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-le-resolver}
      traefik.http.routers.orel-kino.middlewares: orel-kino-compress
      traefik.http.middlewares.orel-kino-compress.compress: "true"
      traefik.http.services.orel-kino.loadbalancer.server.port: "8080"

  kino-bot:
    image: ghcr.io/geometrik32/kino:${KINO_VERSION:-latest}
    command: ["kino-bot"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kino:${POSTGRES_PASSWORD}@kino-db/kino
      BOT_TOKEN: "${BOT_TOKEN:?set BOT_TOKEN in .env}"
      PUBLIC_URL: "${PUBLIC_URL:?set PUBLIC_URL in .env}"
      ADMIN_TELEGRAM_IDS: "${ADMIN_TELEGRAM_IDS:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-ru-RU}"
      TMDB_PROXY: "${TMDB_PROXY:-}"
      TELEGRAM_PROXY: "${TELEGRAM_PROXY:-}"
    depends_on:
      kino-server:
        condition: service_started
    mem_limit: 64m
    networks: [kino, vpn]

  # Our own TorrServer, separate from Lampa's: streams torrents while they download.
  # Reachable only inside this stack; stream cache stays in RAM to keep HDDs quiet.
  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.141.5
    restart: unless-stopped
    # Put deploy/torrserver/settings.json into data/torrserver/config/ before starting.
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
      GOMEMLIMIT: "960MiB"
    volumes:
      - ./data/torrserver:/opt/ts
    ports:
      # BitTorrent peers.
      - "32000:32000"
      - "32000:32000/udp"
    mem_limit: 1280m
    networks: [kino]

  # Wakes Jackett on demand when someone browses for a new title, and stops it after 10m idle.
  # Isolated to the internal network; kino-server never gets direct Docker socket access.
  sablier:
    image: sablierapp/sablier:1.21.1
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 32m
    networks: [kino]

  # Searches trackers on demand; sleeps at 0 MB RAM when idle (managed by sablier).
  # Web UI (LAN only, when awake): http://<server>:9117
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: "no"
    environment:
      PUID: "${PUID:-568}"
      PGID: "${PGID:-568}"
      TZ: Europe/Moscow
    volumes:
      - ./data/jackett:/config
    ports:
      - "9117:9117"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 -o /dev/null http://127.0.0.1:9117/UI/Login || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      sablier.enable: "true"
      sablier.group: "jackett"
    mem_limit: 256m
    networks: [kino, vpn]

  # Downloads releases in advance ("Скачать заранее") to the HDD pool.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-568}"
      PGID: "${PGID:-568}"
      TZ: Europe/Moscow
      WEBUI_PORT: "8085"
    volumes:
      - ./data/qbittorrent:/config
      - ${DOWNLOADS_DIR:-/mnt/HDD_Data/orel-kino}:/downloads
    ports:
      - "8085:8085"
      - "6882:6882"
      - "6882:6882/udp"
    mem_limit: 384m
    networks: [kino]

networks:
  kino: {}
  proxy:
    external: true
  # The 3x-ui network: its Xray has a SOCKS inbound that sends only Telegram
  # and TMDB abroad (TELEGRAM_PROXY / TMDB_PROXY in .env).
  vpn:
    external: true
    name: ${VPN_NETWORK:-3x-ui_default}
