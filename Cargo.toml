[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/bot", "crates/ui", "crates/preview", "app"]
# The Dioxus app targets wasm32; build it with `dx` (see README).
default-members = ["crates/core", "crates/server", "crates/bot", "crates/ui", "crates/preview"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
kino-core = { path = "crates/core" }
kino-server = { path = "crates/server" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
