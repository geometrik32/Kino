name: Android (APK)

# Builds the arm64 Android APK with native ExoPlayer + Jellyfin FFmpeg decoder.
# Every run keeps the APK as an artifact; `main` publishes release "android-latest".
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/ui/**"
      - "crates/core/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/ui/**"
      - "crates/core/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & NDK
        shell: bash
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || echo "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH="$(ls -d "$ANDROID_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            "$SDK_MANAGER" "ndk;27.2.12479018"
            NDK_PATH="$ANDROID_ROOT/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/Dioxus.toml', '.github/workflows/android.yml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dx (Dioxus CLI 0.7.10)
        shell: bash
        run: |
          TMP_DX="$(mktemp -d)"
          curl -fsSL "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz" -o "$TMP_DX/dx.tar.gz"
          tar -xzf "$TMP_DX/dx.tar.gz" -C "$TMP_DX"
          DX_BIN="$(find "$TMP_DX" -type f -name dx | head -n 1)"
          install -m 755 "$DX_BIN" /usr/local/bin/dx
          rm -rf "$TMP_DX"
          dx --version

      - name: Version
        id: ver
        shell: bash
        run: echo "v=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Clippy (Android)
        shell: bash
        run: cargo clippy -p kino-app --no-default-features --features mobile --target aarch64-linux-android --all-targets --locked -- -D warnings

      - name: Configure optional release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/android/release.jks
            cat >> app/Dioxus.toml <<EOF

          [bundle.android]
          jks_file = "android/release.jks"
          jks_password = "$ANDROID_KEYSTORE_PASSWORD"
          key_alias = "$ANDROID_KEY_ALIAS"
          key_password = "$ANDROID_KEY_PASSWORD"
          EOF
          fi

      - name: Build Android APK
        shell: bash
        run: |
          dx bundle --package kino-app --platform android --target aarch64-linux-android --release --package-types apk --out-dir dist
          APK_IN="$(find dist target/dx -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_IN" ]; then
            echo "No APK generated" >&2
            exit 1
          fi
          mkdir -p out
          cp "$APK_IN" out/orel-kino-arm64.apk
          ls -lh out/orel-kino-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orel-kino-android
          path: out/orel-kino-arm64.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag=android-latest; title="Android: последняя сборка из main"
          else
            tag=android-preview; title="Android: пробная сборка (ветка ${{ github.head_ref }})"
          fi
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/orel-kino-arm64.apk \
            --prerelease --title "$title, ${{ steps.ver.outputs.v }}" \
            --notes "APK «Орловского кинопоказа» (arm64, ExoPlayer + Jellyfin FFmpeg). Коммит ${{ github.sha }}."
