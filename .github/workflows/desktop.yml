name: Desktop (Windows)

# Builds the Windows app and its installer. Every run keeps the installer as an artifact;
# a build of `main` also becomes the release "desktop-latest" with a stable download link.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/mpv/**"
      - "crates/ui/**"
      - "crates/core/**"
      - "app/**"
      - "Cargo.*"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "crates/mpv/**"
      - "crates/ui/**"
      - "crates/core/**"
      - "app/**"
      - "Cargo.*"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: bash
        run: echo "v=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: cargo clippy -p kino-desktop -p kino-mpv --all-targets --locked -- -D warnings
      - run: cargo test -p kino-desktop -p kino-mpv --locked
      - run: cargo build --release -p kino-desktop --locked

      # libmpv: the video player library, built for Windows by the mpv project's community.
      - name: Fetch libmpv
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "no mpv-dev asset in release $($rel.tag_name)" }
          Write-Host "libmpv from $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          Get-ChildItem mpv-dev -Recurse -Filter *.dll | ForEach-Object { Write-Host $_.FullName }
          New-Item -ItemType Directory -Force stage | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in the archive" }
          Copy-Item $dll.FullName stage/libmpv-2.dll
          Copy-Item target/release/orel-kino.exe stage/orel-kino.exe

      - name: Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = (Resolve-Path stage).Path
          $out = Join-Path (Get-Location) "dist/Orel-Kino-Setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=${{ steps.ver.outputs.v }}" "/DSTAGE=$stage" "/DOUTFILE=$out" desktop/installer/orel-kino.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Compress-Archive -Path stage/* -DestinationPath dist/Orel-Kino-portable.zip
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: orel-kino-windows
          path: dist/*
          retention-days: 30

      # `main` -> release "desktop-latest"; a pull request of this repository -> "desktop-preview".
      # The download link stays the same: .../releases/download/<tag>/Orel-Kino-Setup.exe
      - name: Publish release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag=desktop-latest; title="Windows: последняя сборка из main"
          else
            tag=desktop-preview; title="Windows: пробная сборка (ветка ${{ github.head_ref }})"
          fi
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/Orel-Kino-Setup.exe dist/Orel-Kino-portable.zip \
            --prerelease --title "$title, ${{ steps.ver.outputs.v }}" \
            --notes "Установщик «Орловского кинопоказа» для Windows. Коммит ${{ github.sha }}."
