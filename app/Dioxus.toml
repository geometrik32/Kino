[application]
name = "kino"
default_platform = "web"
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "ru.aatterra.orelkino"
publisher = "Орловский кинопоказ"
short_description = "Орловский кинопоказ"

[web.app]
title = "Орловский кинопоказ"

[web.resource]
style = []
# Telegram Mini App SDK is loaded dynamically on web only when Telegram launch params are present.
script = []

[web.resource.dev]
script = []

[android]
min_sdk = 24
target_sdk = 35
compile_sdk = 35
gradle_dependencies = [
    "androidx.core:core-ktx:1.15.0",
    "androidx.media3:media3-exoplayer:1.9.0",
    "androidx.media3:media3-ui:1.9.0",
    "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1",
]
proguard_rules = ["android/proguard-kino.pro"]

[android.application]
uses_cleartext_traffic = false
large_heap = true
