[package]
name = "kino-app"
description = "Kino client in Dioxus: website and Telegram Mini App (desktop and mobile later)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kino-core.workspace = true
kino-ui = { path = "../crates/ui" }
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde_json.workspace = true
dioxus = { version = "0.7", features = ["web", "router"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "HtmlElement", "UrlSearchParams", "History", "HtmlMediaElement", "HtmlVideoElement", "Navigator"] }
