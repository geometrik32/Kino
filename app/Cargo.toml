[package]
name = "kino-app"
description = "Kino client in Dioxus: website and Telegram Mini App (desktop and mobile later)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# One crate, three kinds of builds. `dx` picks the feature of its platform.
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
kino-core.workspace = true
kino-ui = { path = "../crates/ui" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
dioxus = { version = "0.7", features = ["router"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
urlencoding = "2"

# In the browser (WebAssembly).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "HtmlElement", "DomTokenList", "UrlSearchParams", "History", "EventTarget", "PopStateEvent", "HtmlMediaElement", "HtmlVideoElement", "Navigator"] }

# Native apps (phone, desktop).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
